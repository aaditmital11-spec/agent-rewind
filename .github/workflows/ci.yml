name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # A real Postgres with pgvector, so the recorder tests run against the same database as production.
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentrewind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agentrewind"
          --health-interval 2s
          --health-retries 15

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/agentrewind
      # Tests never call Gemini. The client just needs a value when it is created.
      GEMINI_API_KEY: not-used-in-ci

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Service containers start before checkout, so the schema is applied here instead of by mounting init.sql.
      - name: Create schema
        run: psql "$DATABASE_URL" -f db/init.sql

      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build app and embedding service images
        run: docker compose build
